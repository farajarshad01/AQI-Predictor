name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gap_fill = insert only the missing recent hours (default). backfill = rebuild old history from the archive."
        type: choice
        options:
          - gap_fill
          - backfill
        default: gap_fill
      days:
        description: "gap_fill only: how many past days to check (max 89)"
        type: string
        default: "75"
      apply:
        description: "gap_fill only: tick to insert the rows. Unticked = dry run, nothing is changed."
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest

    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      BACKFILL_START_DATE: ${{ secrets.BACKFILL_START_DATE }}
      BACKFILL_END_DATE: ${{ secrets.BACKFILL_END_DATE }}
      LATITUDE: ${{ secrets.LATITUDE }}
      LONGITUDE: ${{ secrets.LONGITUDE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backfill
        if: ${{ inputs.mode == 'backfill' }}
        run: |
          python -m src.backfill

      - name: Gap fill (dry run unless "apply" is ticked)
        if: ${{ inputs.mode == 'gap_fill' }}
        env:
          DAYS: ${{ inputs.days }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python -m src.gap_fill --days "$DAYS" --apply
          else
            python -m src.gap_fill --days "$DAYS"
          fi
